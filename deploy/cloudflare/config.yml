# Cloudflare Tunnel (locally-managed) for MQTT Dash.
# 1. cloudflared tunnel login
# 2. cloudflared tunnel create mqtt-dash          -> prints the tunnel UUID and writes <UUID>.json
# 3. cloudflared tunnel route dns mqtt-dash dash.example.com
# 4. copy this file to /etc/cloudflared/config.yml, fill in the UUID + hostname
# 5. sudo cloudflared service install && sudo systemctl start cloudflared

tunnel: <TUNNEL-UUID>
credentials-file: /etc/cloudflared/<TUNNEL-UUID>.json

ingress:
  # Dashboard UI, REST API and MQTT-over-WebSockets (wss://dash.example.com/mqtt)
  - hostname: dash.example.com
    service: http://localhost:8080
  # Optional: raw MQTT TCP. Clients must run `cloudflared access tcp` locally (see README).
  # - hostname: mqtt-tcp.example.com
  #   service: tcp://localhost:1883
  - service: http_status:404
